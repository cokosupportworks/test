<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>一画ずつ なぞり書きマスター | 小学校・特別支援・幼児向け</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f8fafc;
      --text: #1e293b;
      --border: #cbd5e1;
      --radius: 16px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: none;
    }
    header {
      background: #ffffff;
      border-bottom: 2px solid #e2e8f0;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 10;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 900;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }
    .word-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      max-width: 40vw;
      padding: 2px;
    }
    .word-pill {
      background: #f1f5f9;
      border: 2px solid #cbd5e1;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      font-size: 1rem;
    }
    .word-pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary-hover);
    }
    .word-pill.completed {
      background: #dcfce7;
      color: #166534;
      border-color: #86efac;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      appearance: none;
      border: 2px solid var(--border);
      background: #ffffff;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: transform 0.1s;
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary-hover);
    }
    .badge {
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border: 2px solid #7dd3fc;
      background: #e0f2fe;
      color: #0369a1;
      white-space: nowrap;
    }
    .badge.easy { background: #fef9c3; border-color: #fde047; color: #854d0e; }
    .badge.strict { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }

    main {
      flex: 1;
      display: flex;
      padding: 12px;
      gap: 16px;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .sidebar {
      width: 130px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
    }
    .tool-card {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: var(--radius);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tool-btn {
      width: 100%;
      padding: 10px 4px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      cursor: pointer;
      font-family: inherit;
    }
    .tool-btn:active {
      transform: scale(0.95);
    }
    .tool-btn.active {
      background: #eff6ff;
      border-color: var(--primary);
      color: var(--primary);
    }

    .stage {
      flex: 1;
      max-width: min(78vh, 560px);
      aspect-ratio: 1/1;
      position: relative;
      background: #ffffff;
      border-radius: 24px;
      border: 4px solid #334155;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    .grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .grid-inner {
      position: absolute;
      inset: 10px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
    }
    .grid-h {
      position: absolute;
      top: 50%;
      left: 10px;
      right: 10px;
      height: 2px;
      background-image: linear-gradient(to right, #94a3b8 50%, transparent 0%);
      background-size: 14px 2px;
    }
    .grid-v {
      position: absolute;
      left: 50%;
      top: 10px;
      bottom: 10px;
      width: 2px;
      background-image: linear-gradient(to bottom, #94a3b8 50%, transparent 0%);
      background-size: 2px 14px;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #templateCanvas { z-index: 2; pointer-events: none; }
    #drawCanvas { z-index: 4; cursor: crosshair; }
    #animCanvas { z-index: 6; pointer-events: none; }
    .counter {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(255,255,255,0.92);
      border: 2px solid #cbd5e1;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 900;
      z-index: 10;
      pointer-events: none;
    }
    .counter span { color: var(--primary); font-size: 1.15rem; }
    .toast {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: #1e293b;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 700;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s ease;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: var(--danger); }
    .toast.success { background: var(--success); }
    .hanamaru {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.92);
    }
    .hanamaru.show { display: flex; }
    .stamp-svg { width: 190px; height: 190px; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.6);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #ffffff;
      width: 100%;
      max-width: 620px;
      max-height: 85vh;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 3px solid #e2e8f0;
    }
    .modal-head {
      padding: 14px 18px;
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      font-weight: 900;
    }
    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .tab-bar {
      display: flex;
      gap: 6px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 6px;
      overflow-x: auto;
    }
    .tab-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      background: #f1f5f9;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active { background: var(--primary); color: #ffffff; }
    .char-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
    }
    .char-card {
      aspect-ratio: 1/1;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1.3rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }
    .char-card:active { background: #dbeafe; }
    .input-box { display: flex; gap: 6px; }
    .text-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 10px;
      border: 2px solid #cbd5e1;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 700;
      outline: none;
    }
    .text-input:focus { border-color: var(--primary); }
    .slider { width: 100%; height: 8px; border-radius: 4px; accent-color: var(--primary); }

    @media (max-width: 768px) {
      main { flex-direction: column; padding: 6px; gap: 6px; }
      .sidebar { width: 100%; height: auto; flex-direction: row; justify-content: space-around; }
      .tool-card { flex-direction: row; width: 100%; justify-content: space-around; }
      .stage { max-width: min(60vh, 90vw); }
    }
  </style>
</head>
<body>

  <svg id="svgHelper" style="position:fixed; top:-9999px; left:-9999px; width:109px; height:109px; visibility:hidden; pointer-events:none;" viewBox="0 0 109 109">
    <path id="svgHelperPath" d="" />
  </svg>

  <header>
    <div class="app-title-area">
      <div class="logo">✍️ なぞり書きマスター</div>
      <div class="word-pills" id="wordPills"></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="btnOpenSelect">📖 お題</button>
      <div class="badge" id="badgeStrict" title="判定変更">判定: ふつう</div>
      <button class="btn" id="btnSound">🔊</button>
      <button class="btn" id="btnSettings">⚙️</button>
    </div>
  </header>

  <main>
    <aside class="sidebar">
      <div class="tool-card">
        <button class="tool-btn" id="btnDemo"><span>▶️</span>お手本</button>
        <button class="tool-btn" id="btnUndo"><span>↩️</span>一画戻す</button>
        <button class="tool-btn" id="btnReset"><span>🔄</span>やり直す</button>
      </div>
      <div class="tool-card">
        <button class="tool-btn active" id="btnGrid"><span>田</span>マス目</button>
        <button class="tool-btn active" id="btnGuide"><span>📍</span>始点ガイド</button>
      </div>
    </aside>

    <section class="stage" id="stage">
      <div class="grid" id="gridLayer">
        <div class="grid-inner"></div>
        <div class="grid-h"></div>
        <div class="grid-v"></div>
      </div>
      <div class="counter"><span id="curStroke">1</span> / <span id="totalStroke">3</span> 画</div>
      <canvas id="templateCanvas"></canvas>
      <canvas id="drawCanvas"></canvas>
      <canvas id="animCanvas"></canvas>
      <div class="toast" id="toast"></div>

      <div class="hanamaru" id="hanamaru">
        <svg class="stamp-svg" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="85" fill="#fee2e2"/>
          <circle cx="100" cy="100" r="75" fill="none" stroke="#dc2626" stroke-width="5" stroke-dasharray="8 4"/>
          <circle cx="100" cy="100" r="50" fill="none" stroke="#dc2626" stroke-width="5"/>
          <text x="100" y="106" font-size="28" font-weight="900" fill="#dc2626" text-anchor="middle">たいへん</text>
          <text x="100" y="136" font-size="24" font-weight="900" fill="#dc2626" text-anchor="middle">よくできました</text>
        </svg>
        <div style="font-size:1.6rem; font-weight:900; color:#dc2626; margin:10px 0;">合格！はなまる</div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-primary" id="btnNextCharStamp">つぎの文字 ➔</button>
          <button class="btn" id="btnReplayCharStamp">もう一度 🔄</button>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="tool-card">
        <button class="tool-btn" id="btnPrev"><span>⬅️</span>前の文字</button>
        <button class="tool-btn" id="btnNext"><span>➡️</span>次の文字</button>
      </div>
      <div class="tool-card">
        <button class="tool-btn" id="btnSkip"><span>⏩</span>一画パス</button>
      </div>
    </aside>
  </main>

  <!-- Select Modal -->
  <div class="modal-overlay" id="modalSelect">
    <div class="modal">
      <div class="modal-head">
        <span>📖 お題の文字をえらぶ</span>
        <button class="btn" id="btnCloseSelect">✕</button>
      </div>
      <div class="modal-body">
        <div>
          <label style="font-weight:700; font-size:0.9rem; display:block; margin-bottom:6px;">✍️ 好きな文字・言葉を入力（名前、熟語など）</label>
          <div class="input-box">
            <input type="text" class="text-input" id="customInput" placeholder="例：やま、川、学校、ありがとう" maxlength="20">
            <button class="btn btn-primary" id="btnApplyCustom">決定</button>
          </div>
        </div>
        <hr style="border:none; border-top:1px solid #e2e8f0;">
        <div class="tab-bar" id="tabBar">
          <button class="tab-btn active" data-tab="hiragana">ひらがな</button>
          <button class="tab-btn" data-tab="katakana">カタカナ</button>
          <button class="tab-btn" data-tab="kanji1">小1 漢字</button>
          <button class="tab-btn" data-tab="kanji2">小2 漢字</button>
          <button class="tab-btn" data-tab="numbers">すうじ</button>
        </div>
        <div class="char-grid" id="charGrid"></div>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="modalSettings">
    <div class="modal" style="max-width:480px;">
      <div class="modal-head">
        <span>⚙️ 設定・判定の厳しさ調整</span>
        <button class="btn" id="btnCloseSettings">✕</button>
      </div>
      <div class="modal-body">
        <div>
          <label style="font-weight:700; font-size:0.9rem; display:block; margin-bottom:6px;">🎯 判定の厳しさプリセット</label>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;">
            <button class="btn set-strict" data-level="easy">🌱 甘口<br><small>やさしい</small></button>
            <button class="btn set-strict btn-primary" data-level="normal">⭐ ふつう<br><small>標準</small></button>
            <button class="btn set-strict" data-level="strict">🔥 辛口<br><small>美文字</small></button>
          </div>
        </div>
        <div>
          <div style="display:flex; justify-content:space-between; font-weight:700; font-size:0.88rem; margin-bottom:4px;">
            <span>線のブレ許容幅</span><span id="lblTol">26px</span>
          </div>
          <input type="range" class="slider" id="sldTol" min="14" max="46" value="26">
        </div>
        <div>
          <div style="display:flex; justify-content:space-between; font-weight:700; font-size:0.88rem; margin-bottom:4px;">
            <span>塗りつぶし・書き殴り検知</span><span id="lblFill">1.6倍まで</span>
          </div>
          <input type="range" class="slider" id="sldFill" min="12" max="25" value="16">
        </div>
      </div>
    </div>
  </div>

  <script>
  (function() {
    'use strict';

    // 1. Web Audio Synthesizer
    class Sound {
      constructor() { this.ctx = null; this.on = true; }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{});
      }
      success() {
        if (!this.on) return; this.init(); if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
          o.type = 'sine'; o.frequency.setValueAtTime(523.25, t); o.frequency.setValueAtTime(783.99, t + 0.08);
          g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
          o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + 0.3);
        } catch(e){}
      }
      fail() {
        if (!this.on) return; this.init(); if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
          o.type = 'triangle'; o.frequency.setValueAtTime(329.63, t); o.frequency.linearRampToValueAtTime(261.63, t + 0.2);
          g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
          o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + 0.25);
        } catch(e){}
      }
      complete() {
        if (!this.on) return; this.init(); if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
            const o = this.ctx.createOscillator(), g = this.ctx.createGain();
            o.type = 'triangle'; o.frequency.setValueAtTime(f, t + i * 0.09);
            g.gain.setValueAtTime(0.18, t + i * 0.09); g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.09 + 0.6);
            o.connect(g); g.connect(this.ctx.destination); o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.6);
          });
        } catch(e){}
      }
    }

      "う": ["M43.75,16.5c1.25,0.88,2.88,1.12,4.25,0.75c4.75-1.25,14-3.75,18.75-4.88c2.12-0.5,4.12,0.88,3.25,2.88c-1.38,3.12-5.75,9.62-8.5,13.5", "M33.75,38.88c1.5,1.12,3.12,1.88,4.75,1.62c9-1.38,26.75-5.88,34-6.25c8.75-0.5,11.75,8.25,8.12,18.25c-5.75,15.75-21.25,35.62-46.38,43.25"],

    // 4. Vector Stroke Loader
    class StrokeLoader {
      constructor() {
        this.cache = new Map();
        for (const [k, v] of Object.entries(EMBEDDED_DB)) {
          this.cache.set(k, v);
        }
      }
      get(ch) {
        return this.cache.get(ch) || null;
      }
      getHex(ch) { return ch.codePointAt(0).toString(16).padStart(5, '0'); }
      async load(ch) {
        if (this.cache.has(ch)) return this.cache.get(ch);
        const k = `kvg_${ch}`;
        const local = localStorage.getItem(k);
        if (local) {
          try { const p = JSON.parse(local); this.cache.set(ch, p); return p; } catch(e){}
        }
        const hex = this.getHex(ch);
        const urls = [
          `https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/${hex}.svg`,
          `https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/${hex}.svg`,
          `https://unpkg.com/kanjivg@latest/kanji/${hex}.svg`
        ];
        for (const u of urls) {
          try {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 1800);
            const res = await fetch(u, { cache: 'force-cache', signal: controller.signal });
            clearTimeout(timer);
            if (res.ok) {
              const txt = await res.text();
              const doc = new DOMParser().parseFromString(txt, 'image/svg+xml');
              const paths = Array.from(doc.querySelectorAll('path[d]'))
                .filter(p => !((p.getAttribute('id')||'').includes('StrokeNumbers')))
                .map(p => p.getAttribute('d'));
              if (paths.length > 0) {
                this.cache.set(ch, paths);
                try { localStorage.setItem(k, JSON.stringify(paths)); } catch(e){}
                return paths;
              }
            }
          } catch(e){}
        }
        return ["M25,25 L85,85", "M85,25 L25,85"];
      }
    }

    // 5. SVG Curve Sampler
    function samplePath(dStr, w, h) {
      const margin = w * 0.12, area = w - margin * 2, scale = area / 109;
      try {
        const pEl = document.getElementById('svgHelperPath');
        if (pEl && pEl.getTotalLength) {
          pEl.setAttribute('d', dStr);
          const L = pEl.getTotalLength();
          if (L > 0) {
            const count = Math.max(30, Math.ceil(L * scale / 2));
            const pts = [];
            for (let i = 0; i <= count; i++) {
              const pt = pEl.getPointAtLength((i / count) * L);
              pts.push({ x: margin + pt.x * scale, y: margin + pt.y * scale });
            }
            return pts;
          }
        }
      } catch(e){}
      return parsePathMath(dStr, scale, margin);
    }

    function parsePathMath(dStr, scale, offset) {
      const tokens = dStr.match(/([a-df-z]|[-+]?(?:\d*\.\d+|\d+)(?:[eE][-+]?\\d+)?)/gi) || [];
      let cx = 0, cy = 0, lx = 0, ly = 0, lastCmd = '', i = 0;
      const pts = [];
      const num = () => parseFloat(tokens[i++]);

      while (i < tokens.length) {
        const tok = tokens[i++];
        if (/^[a-df-z]$/i.test(tok)) lastCmd = tok;
        else i--;
        const cmd = lastCmd, rel = (cmd === cmd.toLowerCase()), type = cmd.toUpperCase();

        if (type === 'M') {
          cx = num() + (rel ? cx : 0); cy = num() + (rel ? cy : 0);
          pts.push({ x: offset + cx * scale, y: offset + cy * scale });
          lastCmd = rel ? 'l' : 'L';
        } else if (type === 'L' || type === 'H' || type === 'V') {
          let nx = cx, ny = cy;
          if (type === 'L') { nx = num() + (rel ? cx : 0); ny = num() + (rel ? cy : 0); }
          else if (type === 'H') nx = num() + (rel ? cx : 0);
          else if (type === 'V') ny = num() + (rel ? cy : 0);
          for (let s = 1; s <= 10; s++) {
            const t = s / 10;
            pts.push({ x: offset + (cx + t*(nx-cx))*scale, y: offset + (cy + t*(ny-cy))*scale });
          }
          cx = nx; cy = ny;
        } else if (type === 'C' || type === 'S') {
          let cp1x = cx, cp1y = cy;
          if (type === 'C') { cp1x = num() + (rel ? cx : 0); cp1y = num() + (rel ? cy : 0); }
          else if ('CS'.includes(lastCmd.toUpperCase())) { cp1x = 2*cx - lx; cp1y = 2*cy - ly; }
          const cp2x = num() + (rel ? cx : 0), cp2y = num() + (rel ? cy : 0);
          const ex = num() + (rel ? cx : 0), ey = num() + (rel ? cy : 0);
          for (let s = 1; s <= 20; s++) {
            const t = s / 20, mt = 1 - t;
            const x = mt*mt*mt*cx + 3*mt*mt*t*cp1x + 3*mt*t*t*cp2x + t*t*t*ex;
            const y = mt*mt*mt*cy + 3*mt*mt*t*cp1y + 3*mt*t*t*cp2y + t*t*t*ey;
            pts.push({ x: offset + x * scale, y: offset + y * scale });
          }
          lx = cp2x; ly = cp2y; cx = ex; cy = ey;
        }
      }
      return pts;
    }

    // 6. Strict Stroke Evaluator
    function evaluateStroke(targetPts, userPts, cfg) {
      if (!userPts || userPts.length < 3) return { pass: false, msg: '線が短すぎます' };
      const d = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);
      let tLen = 0, uLen = 0;
      for (let i = 0; i < targetPts.length - 1; i++) tLen += d(targetPts[i], targetPts[i+1]);
      for (let i = 0; i < userPts.length - 1; i++) uLen += d(userPts[i], userPts[i+1]);

      // 1) Direction & Endpoints
      const dStart = d(userPts[0], targetPts[0]), dEnd = d(userPts[userPts.length-1], targetPts[targetPts.length-1]);
      const dRevS = d(userPts[0], targetPts[targetPts.length-1]), dRevE = d(userPts[userPts.length-1], targetPts[0]);
      if (dRevS < dStart && dRevE < dEnd) return { pass: false, msg: 'なぞる向きが逆です（始点から書きましょう）' };
      if (dStart > cfg.startTol) return { pass: false, msg: '書き始めの位置がずれています' };
      if (dEnd > cfg.startTol) return { pass: false, msg: '書き終わりの位置がずれています' };

      // 2) Anti-scribble / Anti-coloring
      const ratio = uLen / Math.max(1, tLen);
      if (ratio > cfg.maxRatio) return { pass: false, msg: 'なぞりすぎ（塗りつぶし）です。一筆でスッと書きましょう' };
      if (ratio < 0.55) return { pass: false, msg: '線が途中で終わっています' };

      // 3) Envelope & Coverage
      let valid = 0, minP = 1, maxP = 0;
      for (const u of userPts) {
        let minDist = Infinity, pRatio = 0, cAcc = 0;
        for (let j = 0; j < targetPts.length - 1; j++) {
          const v = targetPts[j], w = targetPts[j+1], sl = d(v, w);
          const l2 = (v.x - w.x)**2 + (v.y - w.y)**2;
          let t = l2 === 0 ? 0 : Math.max(0, Math.min(1, ((u.x-v.x)*(w.x-v.x) + (u.y-v.y)*(w.y-v.y))/l2));
          const projDist = d(u, { x: v.x + t*(w.x-v.x), y: v.y + t*(w.y-v.y) });
          if (projDist < minDist) { minDist = projDist; pRatio = (cAcc + t*sl) / Math.max(1, tLen); }
          cAcc += sl;
        }
        if (minDist <= cfg.dev) valid++;
        if (pRatio < minP) minP = pRatio;
        if (pRatio > maxP) maxP = pRatio;
      }
      if (valid / userPts.length < cfg.validRatio) return { pass: false, msg: 'お題の線から外れています' };
      if ((maxP - minP) < cfg.minCoverage) return { pass: false, msg: '最後までしっかりなぞりましょう' };

      return { pass: true, msg: '合格！' };
    }

          strict: { dev: 16, startTol: 20, maxRatio: 1.3, validRatio: 0.92, minCoverage: 0.90 }
        };

        this.stage = document.getElementById('stage');
        this.tplCanvas = document.getElementById('templateCanvas');
        this.drwCanvas = document.getElementById('drawCanvas');
        this.anmCanvas = document.getElementById('animCanvas');
        this.tplCtx = this.tplCanvas.getContext('2d');
        this.drwCtx = this.drwCanvas.getContext('2d');
        this.anmCtx = this.anmCanvas.getContext('2d');
        this.toast = document.getElementById('toast');
        this.hanamaru = document.getElementById('hanamaru');

        this.bindEvents();
        this.resize();
        window.addEventListener('resize', () => { this.resize(); this.render(); });
        this.setWord(this.word);
      }

      resize() {
        const r = this.stage.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
        const w = r.width || 460, h = r.height || 460;
        [this.tplCanvas, this.drwCanvas, this.anmCanvas].forEach(c => {
          c.width = w * dpr; c.height = h * dpr;
          const ctx = c.getContext('2d'); ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr, dpr);
        });
        this.W = w; this.H = h;
      }

      setWord(w) {
        if (!w || !w.trim()) return;
        this.word = w.trim();
        this.chars = Array.from(this.word);
        this.cIdx = 0;
        this.renderPills();
        this.loadChar();
      }

      renderPills() {
        const c = document.getElementById('wordPills');
        c.innerHTML = '';
        this.chars.forEach((ch, i) => {
          const p = document.createElement('div');
          p.className = `word-pill ${i === this.cIdx ? 'active' : ''}`;
          p.textContent = `${i + 1}. ${ch}`;
          p.onclick = () => { if (this.cIdx !== i) { this.cIdx = i; this.renderPills(); this.loadChar(); } };
          c.appendChild(p);
        });
      }

      loadChar() {
        this.hanamaru.classList.remove('show');
        this.stopAnim();
        const ch = this.chars[this.cIdx];
        const sync = loader.get(ch);
        if (sync) {
          this.applyStrokes(sync);
        } else {
          loader.load(ch).then(paths => this.applyStrokes(paths));
        }
      }

      applyStrokes(paths) {
        this.strokes = paths || ["M25,25 L85,85", "M85,25 L25,85"];
        this.sIdx = 0;
        this.drawing = [];
        document.getElementById('curStroke').textContent = 1;
        document.getElementById('totalStroke').textContent = this.strokes.length;
        this.renderPills();
        this.render();
      }

      render() {
        const ctx = this.tplCtx;
        ctx.clearRect(0, 0, this.W, this.H);
        if (!this.strokes || this.strokes.length === 0) return;

        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        this.strokes.forEach((d, i) => {
          const pts = samplePath(d, this.W, this.H);
          if (pts.length === 0) return;

          ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
          for (let j = 1; j < pts.length; j++) ctx.lineTo(pts[j].x, pts[j].y);

          if (i < this.sIdx) {
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 14; ctx.stroke();
          } else if (i === this.sIdx) {
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.65)'; ctx.lineWidth = 18; ctx.stroke();
            ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]); ctx.stroke(); ctx.setLineDash([]);
            if (this.showGuide && pts.length > 0) {
              const sp = pts[0];
              ctx.beginPath(); ctx.arc(sp.x, sp.y, 14, 0, Math.PI*2); ctx.fillStyle = 'rgba(239,68,68,0.25)'; ctx.fill();
              ctx.beginPath(); ctx.arc(sp.x, sp.y, 8, 0, Math.PI*2); ctx.fillStyle = '#dc2626'; ctx.fill();
              ctx.beginPath(); ctx.arc(sp.x - 18, sp.y - 18, 12, 0, Math.PI*2); ctx.fillStyle = '#2563eb'; ctx.fill();
              ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
              ctx.fillText(i + 1, sp.x - 18, sp.y - 18);
            }
          } else {
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)'; ctx.lineWidth = 14; ctx.stroke();
          }
        });

        const dCtx = this.drwCtx;
        dCtx.clearRect(0, 0, this.W, this.H);
        if (this.drawing.length > 0) {
          dCtx.lineCap = 'round'; dCtx.lineJoin = 'round'; dCtx.lineWidth = 14; dCtx.strokeStyle = '#1e293b';
          if (this.drawing.length === 1) {
            dCtx.beginPath(); dCtx.arc(this.drawing[0].x, this.drawing[0].y, 7, 0, Math.PI*2); dCtx.fillStyle = '#1e293b'; dCtx.fill();
          } else {
            dCtx.beginPath(); dCtx.moveTo(this.drawing[0].x, this.drawing[0].y);
            for (let k = 1; k < this.drawing.length; k++) dCtx.lineTo(this.drawing[k].x, this.drawing[k].y);
            dCtx.stroke();
          }
        }
      }

      getPos(e) {
        const r = this.drwCanvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }

      bindEvents() {
        const c = this.drwCanvas;
        c.addEventListener('pointerdown', e => {
          e.preventDefault(); sound.init();
          this.isDown = true;
          try { c.setPointerCapture(e.pointerId); } catch(err){}
          this.drawing = [this.getPos(e)];
          this.render();
        });
        c.addEventListener('pointermove', e => {
          if (!this.isDown) return;
          e.preventDefault();
          this.drawing.push(this.getPos(e));
          this.render();
        });
        c.addEventListener('pointerup', e => {
          if (!this.isDown) return;
          this.isDown = false;
          try { c.releasePointerCapture(e.pointerId); } catch(err){}
          this.checkStroke();
        });
        c.addEventListener('pointercancel', () => { this.isDown = false; this.drawing = []; this.render(); });

        document.getElementById('btnDemo').onclick = () => this.playDemo();
        document.getElementById('btnUndo').onclick = () => {
          if (this.sIdx > 0) {
            this.sIdx--; document.getElementById('curStroke').textContent = this.sIdx + 1;
            this.render(); this.showToast('一画戻しました');
          }
        };
        document.getElementById('btnReset').onclick = () => {
          this.sIdx = 0; document.getElementById('curStroke').textContent = 1;
          this.render(); this.showToast('最初からやり直します');
        };
        document.getElementById('btnSkip').onclick = () => {
          if (this.sIdx < this.strokes.length) {
            this.sIdx++;
            if (this.sIdx >= this.strokes.length) this.finishChar();
            else { document.getElementById('curStroke').textContent = this.sIdx + 1; this.render(); }
          }
        };
        document.getElementById('btnGrid').onclick = (e) => {
          this.showGrid = !this.showGrid;
          document.getElementById('gridLayer').style.display = this.showGrid ? 'block' : 'none';
          e.currentTarget.classList.toggle('active', this.showGrid);
        };
        document.getElementById('btnGuide').onclick = (e) => {
          this.showGuide = !this.showGuide;
          e.currentTarget.classList.toggle('active', this.showGuide);
          this.render();
        };
        document.getElementById('btnPrev').onclick = () => {
          if (this.cIdx > 0) { this.cIdx--; this.renderPills(); this.loadChar(); }
        };
        document.getElementById('btnNext').onclick = () => {
          if (this.cIdx < this.chars.length - 1) { this.cIdx++; this.renderPills(); this.loadChar(); }
        };
        document.getElementById('btnNextCharStamp').onclick = () => {
          this.cIdx = (this.cIdx + 1) % this.chars.length; this.renderPills(); this.loadChar();
        };
        document.getElementById('btnReplayCharStamp').onclick = () => this.loadChar();

        document.getElementById('btnSound').onclick = (e) => {
          sound.on = !sound.on; e.currentTarget.textContent = sound.on ? '🔊' : '🔇';
          this.showToast(sound.on ? '効果音: ON' : '効果音: OFF');
        };

        document.getElementById('badgeStrict').onclick = () => {
          const lvls = ['easy', 'normal', 'strict'];
          this.setStrict(lvls[(lvls.indexOf(this.level) + 1) % lvls.length]);
        };

        const mSel = document.getElementById('modalSelect'), mSet = document.getElementById('modalSettings');
        document.getElementById('btnOpenSelect').onclick = () => { this.populateGrid('hiragana'); mSel.classList.add('open'); };
        document.getElementById('btnCloseSelect').onclick = () => mSel.classList.remove('open');
        document.getElementById('btnSettings').onclick = () => mSet.classList.add('open');
        document.getElementById('btnCloseSettings').onclick = () => mSet.classList.remove('open');

        document.querySelectorAll('#tabBar .tab-btn').forEach(btn => {
          btn.onclick = () => {
            document.querySelectorAll('#tabBar .tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active'); this.populateGrid(btn.dataset.tab);
          };
        });

        const inp = document.getElementById('customInput');
        document.getElementById('btnApplyCustom').onclick = () => {
          if (inp.value.trim()) { this.setWord(inp.value.trim()); mSel.classList.remove('open'); inp.value = ''; }
        };
        inp.onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('btnApplyCustom').click(); };

        document.querySelectorAll('.set-strict').forEach(btn => {
          btn.onclick = () => this.setStrict(btn.dataset.level);
        });

        document.getElementById('sldTol').oninput = (e) => {
          const v = parseInt(e.target.value, 10);
          this.params[this.level].dev = v;
          document.getElementById('lblTol').textContent = `${v}px`;
        };
        document.getElementById('sldFill').oninput = (e) => {
          const v = parseFloat(e.target.value) / 10;
          this.params[this.level].maxRatio = v;
          document.getElementById('lblFill').textContent = `${v}倍まで`;
        };
      }

      setStrict(lvl) {
        this.level = lvl;
        const b = document.getElementById('badgeStrict');
        b.className = `badge ${lvl}`;
        const names = { easy: '甘口 (やさしい)', normal: 'ふつう (標準)', strict: '辛口 (しっかり)' };
        b.textContent = `判定: ${names[lvl] || lvl}`;
        document.querySelectorAll('.set-strict').forEach(btn => {
          btn.classList.toggle('btn-primary', btn.dataset.level === lvl);
        });
        const p = this.params[lvl];
        document.getElementById('sldTol').value = p.dev;
        document.getElementById('lblTol').textContent = `${p.dev}px`;
        document.getElementById('sldFill').value = Math.round(p.maxRatio * 10);
        document.getElementById('lblFill').textContent = `${p.maxRatio}倍まで`;
        this.showToast(`判定を「${names[lvl]}」に変更`);
      }

      populateGrid(tab) {
        const g = document.getElementById('charGrid'); g.innerHTML = '';
        (PRESETS[tab] || []).forEach(ch => {
          const b = document.createElement('button');
          b.className = 'char-card'; b.textContent = ch;
          b.onclick = () => { this.setWord(ch); document.getElementById('modalSelect').classList.remove('open'); };
          g.appendChild(b);
        });
      }

      checkStroke() {
        if (this.sIdx >= this.strokes.length) return;
        const target = samplePath(this.strokes[this.sIdx], this.W, this.H);
        const res = evaluateStroke(target, this.drawing, this.params[this.level]);

        if (res.pass) {
          sound.success();
          this.showToast('✨ 合格！上手に書けました', 'success');
          this.drawing = [];
          this.sIdx++;
          if (this.sIdx >= this.strokes.length) this.finishChar();
          else {
            document.getElementById('curStroke').textContent = this.sIdx + 1;
            this.render();
          }
        } else {
          sound.fail();
          this.showToast(`⚠️ ${res.msg}`, 'error');
          this.drawing = [];
          this.render();
        }
      }

      finishChar() {
        sound.complete();
        this.render();
        const pills = document.getElementById('wordPills').children;
        if (pills[this.cIdx]) pills[this.cIdx].classList.add('completed');
        setTimeout(() => this.hanamaru.classList.add('show'), 200);
      }

      showToast(msg, type = 'info') {
        this.toast.textContent = msg;
        this.toast.className = `toast show ${type}`;
        if (this.tTimer) clearTimeout(this.tTimer);
        this.tTimer = setTimeout(() => this.toast.classList.remove('show'), 2400);
      }

      playDemo() {
        this.stopAnim();
        if (this.sIdx >= this.strokes.length) this.sIdx = 0;
        const target = samplePath(this.strokes[this.sIdx], this.W, this.H);
        if (target.length === 0) return;

        let frame = 0, total = 45;
        const ctx = this.anmCtx;

        const loop = () => {
          ctx.clearRect(0, 0, this.W, this.H);
          const p = Math.min(1, frame / total);
          const idx = Math.floor(p * (target.length - 1));

          ctx.beginPath(); ctx.moveTo(target[0].x, target[0].y);
          for (let i = 1; i <= idx; i++) ctx.lineTo(target[i].x, target[i].y);
          ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();

          const tip = target[idx];
          ctx.beginPath(); ctx.arc(tip.x, tip.y, 8, 0, Math.PI*2); ctx.fillStyle = '#f97316'; ctx.fill();

          frame++;
          if (frame <= total) this.animId = requestAnimationFrame(loop);
          else setTimeout(() => ctx.clearRect(0, 0, this.W, this.H), 500);
        };
        this.animId = requestAnimationFrame(loop);
      }

      stopAnim() {
        if (this.animId) cancelAnimationFrame(this.animId);
        this.anmCtx.clearRect(0, 0, this.W, this.H);
      }
    }

    function init() {
      if (!window.app) window.app = new App();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
    window.addEventListener('load', init);
  })();
  </script>
</body>
